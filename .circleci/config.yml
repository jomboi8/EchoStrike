version: 2.1

jobs:
  build-test:
    docker:
      - image: cimg/go:1.25
    steps:
      - checkout
      - run:
          name: Download dependencies
          command: go mod download
      - run:
          name: Build
          command: go build ./...
      - run:
          name: Vet
          command: go vet ./...
      - run:
          name: Test
          command: go test ./... -race -cover

workflows:
  build-and-test:
    jobs:
      - build-test
