name: CI

# Manual trigger only: this account currently has a GitHub Actions billing
# lock, so hosted runners can't be provisioned on push. CI runs via CircleCI
# instead (.circleci/config.yml) in the meantime. Once billing is resolved,
# add `push`/`pull_request` triggers back here.
on:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -cover

      - name: Docker build
        run: docker build -t echostrike .
